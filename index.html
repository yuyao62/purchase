<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>藥品採購查詢系統</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
html,body{max-width:100%;overflow-x:hidden;margin:0;background:#f3f4f6;color:#111827;font-size:16px}
*{box-sizing:border-box;max-width:100%}
.app{width:min(1100px,100%);margin:12px auto;background:#fff;padding:14px;border-radius:16px;box-shadow:0 10px 22px rgba(0,0,0,.10)}
h1{margin:0 0 6px;text-align:center}
.sub{color:#6b7280;text-align:center;font-size:13px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
label{font-weight:900}
input,select,button{font-size:16px;padding:8px 12px;border-radius:999px;border:1px solid #d1d5db}
button{border:none;background:#4f46e5;color:#fff;font-weight:900;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.btn2{background:#111827}.btn3{background:#e5e7eb;color:#111827}.btn4{background:#374151}
.pill{padding:4px 12px;border-radius:999px;font-size:14px;font-weight:900}
.p1{background:#dbeafe}.p2{background:#fee2e2;color:#991b1b}.p3{background:#dcfce7;color:#166534}.p4{background:#ede9fe;color:#4c1d95}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:8px;vertical-align:top;word-break:break-word}
th{background:#e5e7eb}
tr:nth-child(even) td{background:#f3f4f6}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:900;font-size:13px}
.t0{background:#e5e7eb}.t1{background:#dcfce7;color:#166534}.t2{background:#fee2e2;color:#991b1b}.t3{background:#ede9fe;color:#5b21b6}
.stock{display:flex;flex-direction:column;gap:6px}
.stockTop{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note{width:100%;padding:6px 10px;border-radius:10px;border:1px solid #d1d5db;font-size:14px}

/* ✅ 上方公告條：永遠顯示、可點進公告明細 */
.announceBar{
  display:block;
  margin:8px 0;
  padding:10px 14px;
  border-radius:14px;
  background:#ede9fe;
  color:#4c1d95;
  font-weight:900;
  cursor:pointer;
  user-select:none;
}
.announceBar:hover{background:#ddd6fe}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:12px}
.box{background:#fff;width:min(980px,100%);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:12px}
.boxHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.boxHead h3{margin:0}
.boxSub{color:#6b7280;font-size:13px;margin:6px 0 10px}
.box .table-wrap{max-height:70vh;overflow:auto;border-radius:12px}
.small{font-size:13px;color:#6b7280}

/* ============================
   ✅ 手機：主清單「一品項一行」
   不左右滑、同一張 table 直向化
   ============================ */
@media(max-width:520px){
  .app{margin:0;border-radius:0;box-shadow:none}

  /* 取消主清單橫向捲（避免左右滑） */
  .table-wrap{overflow-x:visible}

  /* table 轉成直向列表 */
  .mainTable,
  .mainTable thead,
  .mainTable tbody,
  .mainTable tr,
  .mainTable th,
  .mainTable td{
    display:block;
    width:100%;
  }

  /* 手機不顯示表頭 */
  .mainTable thead{display:none}

  /* 每個品項一行（容器） */
  .mainTable tr{
    background:#fff;
    border-radius:14px;
    padding:12px;
    margin:10px 0;
    box-shadow:0 6px 14px rgba(0,0,0,.06);
  }

  /* 每格改成「標籤 + 內容」 */
  .mainTable td{
    padding:0;
    margin:0 0 10px;
    white-space:normal;
    word-break:break-word;
  }
  .mainTable td:last-child{margin-bottom:0}

  .mainTable td::before{
    display:block;
    font-weight:900;
    color:#6b7280;
    font-size:12px;
    margin-bottom:4px;
  }

  .mainTable td:nth-child(1)::before{content:"藥代";}
  .mainTable td:nth-child(2)::before{content:"健保碼";}
  .mainTable td:nth-child(3)::before{content:"藥品";}
  .mainTable td:nth-child(4)::before{content:"用量";}
  .mainTable td:nth-child(5)::before{content:"庫存 / 公告";}

  .mainTable .stockTop{gap:8px;}
  .mainTable .stockTop input[type="number"]{width:140px;max-width:100%;}
  .note{font-size:14px}
}

/* ✅ 手機版：公告明細/需採購清單表格左右滑動（先保留） */
@media (max-width:520px){
  .annTable{display:table;width:100%;min-width:760px;border-collapse:collapse}
  .annTable thead{display:table-header-group}
  .annTable tbody{display:table-row-group}
  .annTable tr{display:table-row}
  .annTable th,.annTable td{
    display:table-cell;
    padding:6px 8px;
    font-size:13px;
    white-space:nowrap;
  }
  .box .table-wrap{overflow-x:auto}
}
</style>
</head>

<body>
<div class="app">
  <h1>藥品採購查詢系統</h1>
  <div class="sub">每月一檔 inventory_YYYY_MM.json（單月為主，支援進階多月）</div>
  <!-- ✅ 顯示「實際載入月份」 -->
  <div class="sub" id="loadInfo" style="font-weight:900;color:#374151"></div>

  <!-- ✅ 直接點上方公告進入公告明細 -->
  <div id="announceBar" class="announceBar"></div>

  <div class="row">
    <label>年份</label><select id="year"></select>
    <label>月份</label>
    <button id="pm" class="btn4" title="上個月">◀</button>
    <select id="m1"></select>
    <button id="nm" class="btn4" title="下個月">▶</button>

    <label style="margin-left:6px">
      <input id="adv" type="checkbox" style="transform:scale(1.1);margin-right:6px">多月進階
    </label>
    <span id="advBox" style="display:none;align-items:center;gap:8px">
      <span class="small">到</span><select id="y2"></select><select id="m2"></select>
    </span>

    <button id="reload" class="btn2">重新載入</button>
    <button id="reset" class="btn3">重置</button>
  </div>

  <div class="row">
    <label>廠商</label>
    <select id="vendorSel"></select>
    <button id="clearVendor" class="btn3">清除廠商</button>
    <button id="vendorPage" class="btn4">廠商頁</button>
  </div>

  <div class="row">
    <label>搜尋</label>
    <input id="q" placeholder="輸入藥代、健保碼或藥品名稱" style="flex:1;min-width:220px">
    <button id="search">搜尋</button>
    <button id="export" class="btn4">匯出 Excel</button>
    <button id="yearView" class="btn4">年度總覽</button>
    <button id="buyView" class="btn4">需採購清單</button>
    <button id="admin" class="btn2">管理者</button>
  </div>

  <div class="row">
    <span class="pill p1" id="cTotal"></span>
    <span class="pill p2" id="cBuy"></span>
    <span class="pill p3" id="cOk"></span>
    <span class="pill p4" id="cAnn"></span>
  </div>

  <div class="table-wrap">
    <table class="mainTable">
      <thead><tr><th>藥代</th><th>健保碼</th><th>藥品</th><th>用量</th><th>庫存 / 公告</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<!-- ✅ 公告明細 -->
<div id="modal" class="modal"><div class="box">
  <div class="boxHead">
    <div>
      <h3>公告明細</h3>
      <div class="boxSub" id="annRule"></div>
    </div>
    <button id="close" class="btn3">關閉</button>
  </div>
  <div class="table-wrap">
    <table class="annTable">
      <thead>
        <tr>
          <th style="width:72px">序號</th>
          <th>藥品（可改名）/ 新增列顯示：藥代＋健保碼＋藥品(10碼)</th>
          <th style="width:130px">庫存（可輸入）</th>
          <th>備註（可輸入）</th>
          <th style="width:150px">操作</th>
        </tr>
      </thead>
      <tbody id="annBody"></tbody>
    </table>
  </div>
</div></div>

<!-- ✅ 需採購清單 -->
<div id="buyModal" class="modal"><div class="box">
  <div class="boxHead">
    <div>
      <h3>需採購清單</h3>
      <div class="boxSub">每種藥代一行（庫存 < 用量）</div>
    </div>
    <button id="buyClose" class="btn3">關閉</button>
  </div>
  <div class="table-wrap">
    <table class="annTable">
      <thead>
        <tr>
          <th>藥代</th>
          <th>健保碼</th>
          <th>藥品</th>
          <th>用量</th>
          <th>庫存</th>
          <th>建議採購</th>
          <th>備註</th>
        </tr>
      </thead>
      <tbody id="buyBody"></tbody>
    </table>
  </div>
</div></div>

<!-- 廠商頁 -->
<div id="vModal" class="modal"><div class="box">
  <div class="boxHead">
    <div>
      <h3 id="vTitle">廠商頁</h3>
      <div class="boxSub">點廠商→看該廠商所有藥（廠商以「前兩個中文」歸類）</div>
    </div>
    <button id="vClose" class="btn3">關閉</button>
  </div>
  <div class="row">
    <input id="vSearch" placeholder="搜尋廠商" style="flex:1;min-width:220px">
    <button id="vClear" class="btn3">清除</button>
  </div>
  <div id="vList" class="row" style="gap:6px"></div>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:10px 0">
  <div class="row">
    <input id="vdSearch" placeholder="搜尋藥代/健保碼/藥品" style="flex:1;min-width:220px">
    <button id="vdClear" class="btn3">清除</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>藥代</th><th>健保碼</th><th>藥品</th><th>用量</th><th>庫存</th></tr></thead>
      <tbody id="vdBody"></tbody>
    </table>
  </div>
</div></div>

<script>
(()=> {
  const $ = (id)=>document.getElementById(id);

  // localStorage keys
  const STOCK="drug_stock_v1",
        NOTE="drug_note_v1",
        NAME="drug_name_override_v1",
        MAN="manual_announce_v1",
        ADMIN="admin_on_v1";

  // persisted state
  const stock   = JSON.parse(localStorage.getItem(STOCK)||"{}");
  const notes   = JSON.parse(localStorage.getItem(NOTE)||"{}");
  const nameMap = JSON.parse(localStorage.getItem(NAME)||"{}");
  const manual  = JSON.parse(localStorage.getItem(MAN)||"{}");

  let adminOn = localStorage.getItem(ADMIN)==="1";
  let rows = [], viewRows = [], vendorMap = new Map();

  // ✅ 依 inventory_index.json 決定可選年月
  let avail = new Map();      // year -> Set(month)
  let availPairs = [];        // [{y,m}, ...] sorted

  const pad2 = (n)=>String(n).padStart(2,"0");
  const file = (y,m)=>`inventory_${y}_${pad2(m)}.json`;

  const normCode = (s)=>String(s||"").trim().toUpperCase();
  const normNH = (s)=>String(s||"").trim().toUpperCase();
  const makeKey = (code, nhCode)=> `${normCode(code)}__${normNH(nhCode)}`;
  const rowKey = (r)=> r ? (r.key || makeKey(r.藥代, r.健保碼)) : "";

  // ✅ 舊版 localStorage 是用「藥代」存，這版改用「藥代+健保碼」；
  //    讀取時保留舊 key fallback，避免舊資料一更新就全部消失。
  const getSaved = (obj, r, def=null)=>{
    const k = rowKey(r);
    const c = String(r?.藥代 || "");
    const n = normCode(c);
    if(k && Object.prototype.hasOwnProperty.call(obj,k)) return obj[k];
    if(c && Object.prototype.hasOwnProperty.call(obj,c)) return obj[c];
    if(n && Object.prototype.hasOwnProperty.call(obj,n)) return obj[n];
    return def;
  };

  // ✅ 手動公告：不受月份影響（優先看 藥代+健保碼 key，兼容舊版藥代 key）
  const isManualAnn = (item)=>{
    if(item && typeof item === "object"){
      const k = rowKey(item);
      const c = String(item.藥代 || "");
      const n = normCode(c);
      return !!manual[k] || !!manual[c] || !!manual[n];
    }
    const c = String(item||"");
    const n = normCode(c);
    return !!manual[c] || !!manual[n];
  };

  // ✅ 公告只看手動公告（已移除外部公告功能）
  const isAnn = (r)=> isManualAnn(r);

  const vendorKey = (s)=>{
    s=(s||"未標示廠商").trim();
    const m=[...s.matchAll(/[\u4E00-\u9FFF]/g)].map(x=>x[0]);
    if(m.length>=2) return m[0]+m[1];
    if(m.length===1) return m[0];
    return (s.replace(/\s+/g," ").slice(0,8) || "其他");
  };

  const tagHTML=(st,u,ann)=>{
    if(ann) return `<span class="tag t3">公告</span>`;
    if(st==null) return `<span class="tag t0">未輸入</span>`;
    if(u>0 && st<u) return `<span class="tag t2">需採購</span>`;
    return `<span class="tag t1">正常</span>`;
  };

  function updateTag(el, st, u, ann=false){
    if(!el) return;
    el.className="tag";
    if(ann){ el.classList.add("t3"); el.textContent="公告"; return; }
    if(st==null || st===""){ el.classList.add("t0"); el.textContent="未輸入"; return; }
    st=Number(st); u=Number(u||0);
    if(u>0 && st<u){ el.classList.add("t2"); el.textContent="需採購"; return; }
    el.classList.add("t1"); el.textContent="正常";
  }

  // ✅ 顯示「實際載入月份」＆ Console debug
  function renderLoadInfo(loadedFiles, missingFiles){
    const el = $("loadInfo");
    if(!el) return;

    const ok = loadedFiles.length;
    const miss = missingFiles.length;

    const pretty = (fn)=>{
      // inventory_2025_09.json -> 2025/09
      const m = String(fn).match(/inventory_(\d{4})_(\d{2})\.json$/);
      if(!m) return fn;
      return `${m[1]}/${m[2]}`;
    };

    const rangeText = ok ? `｜${pretty(loadedFiles[0])} → ${pretty(loadedFiles[ok-1])}` : "";
    el.textContent = `✅ 已載入 ${ok} 個月資料${miss ? `（缺 ${miss} 個月檔案）` : ""}${rangeText}`;

    console.log("[loadData] loadedFiles:", loadedFiles);
    if(missingFiles.length) console.warn("[loadData] missingFiles:", missingFiles);
  }

  // =========================
  // ✅ inventory_index.json
  // =========================
  function buildAvailPairs(){
    const pairs=[];
    [...avail.keys()].sort((a,b)=>a-b).forEach(y=>{
      const set=avail.get(y);
      const months=set ? [...set].sort((a,b)=>a-b) : [];
      months.forEach(m=>pairs.push({y:+y,m:+m}));
    });
    availPairs=pairs;
  }

  async function loadIndex(){
    avail = new Map();
    try{
      const r = await fetch("inventory_index.json", {cache:"no-store"});
      if(r.ok){
        const idx = await r.json();
        // ✅ 同時支援 months / 「月」
        const arr = idx.months || idx["月"] || idx["months"] || [];
        arr.forEach(s=>{
          const m = String(s).trim().match(/^(\d{4})-(\d{2})$/);
          if(!m) return;
          const y = +m[1], mo = +m[2];
          if(!avail.has(y)) avail.set(y, new Set());
          avail.get(y).add(mo);
        });
      }
    }catch(e){
      // ignore
    }

    // fallback：沒有 index 或 index 空 → 至少讓今年 1~12 可用
    if(avail.size===0){
      const y=new Date().getFullYear();
      avail.set(y, new Set(Array.from({length:12},(_,i)=>i+1)));
    }
    buildAvailPairs();
  }

  function fillYearSelect(selId, selectedYear){
    const sel=$(selId);
    if(!sel) return;
    const years = [...avail.keys()].sort((a,b)=>a-b);
    const fallbackYear = new Date().getFullYear();
    if(years.length===0) years.push(fallbackYear);

    const cur = selectedYear ?? sel.value;
    sel.innerHTML="";
    years.forEach(yy=>{
      sel.appendChild(new Option(yy, yy, +yy===+cur, +yy===+cur));
    });

    if(![...sel.options].some(o=>+o.value===+cur)){
      sel.value = years[years.length-1];
    }
  }

  function fillMonthSelect(selId, y, selectedMonth){
    const sel=$(selId);
    if(!sel) return;

    const set = avail.get(+y);
    const months = set ? [...set].sort((a,b)=>a-b) : Array.from({length:12},(_,i)=>i+1);
    const cur = selectedMonth ?? sel.value;

    sel.innerHTML="";
    months.forEach(mm=>{
      sel.appendChild(new Option(mm,mm,+mm===+cur,+mm===+cur));
    });

    if([...sel.options].some(o=>+o.value===+cur)) sel.value = cur;
    else sel.value = months[months.length-1] || (new Date().getMonth()+1);
  }

  function fillMonthsByYear(y){
    fillMonthSelect("m1", y, $("m1").value);
    if($("y2")) fillYearSelect("y2", $("y2").value || y);
    const endYear = $("y2") ? $("y2").value : y;
    fillMonthSelect("m2", endYear, $("m2").value || $("m1").value);

    if(!$("adv").checked){
      if($("y2")) $("y2").value = $("year").value;
      $("m2").value = $("m1").value;
    }
  }

  function setYM(y,m){
    if(![...$("year").options].some(o=>+o.value===+y)){
      const ys=[...$("year").options].map(o=>+o.value);
      y=ys.length?ys[ys.length-1]:y;
    }
    $("year").value = y;

    fillYearSelect("y2", y);
    fillMonthsByYear(y);

    if([...$("m1").options].some(o=>+o.value===+m)) $("m1").value = m;
    else{
      const ms=[...$("m1").options].map(o=>+o.value);
      $("m1").value = ms.length?ms[ms.length-1]:m;
    }

    if(!$("adv").checked){
      if($("y2")) $("y2").value = $("year").value;
      fillMonthSelect("m2", $("year").value, $("m1").value);
      $("m2").value = $("m1").value;
    }else{
      if($("y2") && ![...$("y2").options].some(o=>+o.value===+$("y2").value)) $("y2").value = $("year").value;
      fillMonthSelect("m2", $("y2") ? $("y2").value : $("year").value, $("m2").value || $("m1").value);
    }
  }

  function initSelects(){
    $("year").innerHTML="";
    const years = [...avail.keys()].sort((a,b)=>a-b);
    const fallbackYear = new Date().getFullYear();
    if(years.length===0) years.push(fallbackYear);

    years.forEach((yy,i)=>{
      const isLast = (i===years.length-1);
      $("year").appendChild(new Option(yy, yy, isLast, isLast));
    });

    fillYearSelect("y2", $("year").value);
    fillMonthsByYear($("year").value);
    if($("y2")) $("y2").value = $("year").value;

    $("adv").checked=false;
    $("advBox").style.display="none";

    $("admin").textContent=adminOn?"管理者(開)":"管理者";
  }

  async function loadData(){
    rows=[]; vendorMap=new Map();

    const y=+$("year").value;
    const adv=$("adv").checked;
    const yEnd = adv && $("y2") ? +$("y2").value : y;
    const mStart=+$("m1").value;
    const mEnd=adv?+$("m2").value:mStart;

    const startKey = y*100 + mStart;
    const endKey = yEnd*100 + mEnd;
    const lo = Math.min(startKey, endKey);
    const hi = Math.max(startKey, endKey);

    const agg=new Map();

    // ✅ 強化：記錄實際成功載入的月份（避免缺檔造成平均被稀釋）
    const loadedFiles = [];
    const missingFiles = [];
    let loadedMonths = 0;

    const targets = availPairs.length
      ? availPairs.filter(p => (p.y*100+p.m) >= lo && (p.y*100+p.m) <= hi)
      : (() => {
          const arr=[];
          for(let yy=Math.floor(lo/100); yy<=Math.floor(hi/100); yy++){
            const sm = (yy===Math.floor(lo/100)) ? lo%100 : 1;
            const em = (yy===Math.floor(hi/100)) ? hi%100 : 12;
            for(let mm=sm; mm<=em; mm++) arr.push({y:yy,m:mm});
          }
          return arr;
        })();

    for(const p of targets){
      try{
        const fn = file(p.y,p.m);
        const r=await fetch(fn,{cache:"no-store"});
        if(!r.ok){
          missingFiles.push(fn);
          continue;
        }
        const list=await r.json();

        loadedMonths++;
        loadedFiles.push(fn);

        list.forEach(x=>{
          const code = String(x["藥代"] || "").trim();
          const nhCode = String(x["健保碼"] || "").trim();
          const key = makeKey(code, nhCode);
          const name=x["藥品"];
          const ven=x["廠商"]||"未標示廠商";
          if(!agg.has(key)) agg.set(key,{key:key, 藥代:code, 健保碼:nhCode, 藥品:name, 廠商:ven, sum:0});
          agg.get(key).sum += Number(x["月用量"]||0);
        });
      }catch(e){}
    }

    // ✅ 多月進階：用「區間總用量」，不要平均
    // 單月時 x.sum 就是該月用量；多月時 x.sum 是起訖月份加總
    const monthCount = Math.max(1, loadedMonths);

    rows=[...agg.values()].map(x=>{
      const totalUse = x.sum;
      const vKey = vendorKey(x.廠商);
      if(!vendorMap.has(vKey)) vendorMap.set(vKey,[]);
      const rec={
        key:x.key || makeKey(x.藥代, x.健保碼),
        藥代:x.藥代,
        健保碼:x.健保碼 || "",
        藥品:x.藥品,
        廠商:x.廠商,
        廠商Key:vKey,
        用量:totalUse,
        區間總用量:x.sum,
        月數:monthCount
      };
      vendorMap.get(vKey).push(rec);
      return rec;
    });

    buildVendorDropdown();
    applyFilters();
    renderLoadInfo(loadedFiles, missingFiles);
  }

  function buildVendorDropdown(){
    const sel=$("vendorSel");
    const cur=sel.value || "(全部)";

    [...vendorMap.keys()].sort((a,b)=>a.localeCompare(b,"zh-Hant")).forEach(k=>{
      sel.appendChild(new Option(`${k} (${vendorMap.get(k).length})`,k));
    });
    sel.value=[...sel.options].some(o=>o.value===cur)?cur:"(全部)";

  function applyFilters(){
    const q=$("q").value.trim();
    const v=$("vendorSel").value;

    viewRows=rows.filter(r=>{
      if(v!=="(全部)" && r.廠商Key!==v) return false;
      if(q){
        const hit =
          String(r.藥代||"").includes(q) ||
          String(r.健保碼||"").includes(q) ||
          String(r.藥品||"").includes(q) ||
          String(getSaved(nameMap,r,"")||"").includes(q);
        if(!hit) return false;
      }
      return true;
    });

    viewRows.sort((a,b)=> {
      const c = String(a.藥代||"").localeCompare(String(b.藥代||""),"en",{numeric:true,sensitivity:"base"});
      if(c!==0) return c;
      return String(a.健保碼||"").localeCompare(String(b.健保碼||""),"en",{numeric:true,sensitivity:"base"});
    });

    renderTable(viewRows);
    renderCounts(viewRows);

  // ✅ 年度總覽（匯出 Excel）
  async function exportYearOverview(){
    const y=+$("year").value;
    const map = new Map();

    for(let m=1;m<=12;m++){
      try{
        const r=await fetch(file(y,m),{cache:"no-store"});
        if(!r.ok) continue;
        const list=await r.json();
        list.forEach(x=>{
          const code=String(x["藥代"]||"").trim();
          const nhCode=String(x["健保碼"]||"").trim();
          const key=makeKey(code, nhCode);
          const name=x["藥品"];
          const ven=x["廠商"]||"未標示廠商";
          const use=Number(x["月用量"]||0);

          if(!map.has(key)){
            map.set(key,{key:key, 藥代:code, 健保碼:nhCode, 藥品:name, 廠商:ven, months:Array(12).fill(0)});
          }
          map.get(key).months[m-1]=use;
        });
      }catch(e){}
    }

    const outRows = [...map.values()].map(o=>{
      const nm = getSaved(nameMap,o,null) ?? o.藥品;
      const total = o.months.reduce((a,b)=>a+b,0);
      const avg = total/12;
      const out = {
        藥代:o.藥代,
        健保碼:o.健保碼 || "",
        藥品:nm,
        廠商:o.廠商,
        年總用量: total,
        月平均: Math.round(avg*100)/100
      };
      o.months.forEach((v,i)=> out[`${i+1}月`] = v);
      return out;
    });

    outRows.sort((a,b)=> {
      const c = String(a.藥代||"").localeCompare(String(b.藥代||""),"en",{numeric:true,sensitivity:"base"});
      if(c!==0) return c;
      return String(a.健保碼||"").localeCompare(String(b.健保碼||""),"en",{numeric:true,sensitivity:"base"});
    });

    const ws = XLSX.utils.json_to_sheet(outRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "年度總覽");
    XLSX.writeFile(wb, `年度總覽_${y}.xlsx`);
  }

  // ✅ 依 index 進行「上一月/下一月」切換（跨年也可）
  function shiftMonth(delta){
    const y=+$("year").value;
    const m=+$("m1").value;

    let idx = availPairs.findIndex(p=>p.y===y && p.m===m);

    if(idx<0){
      const sameYear = availPairs.filter(p=>p.y===y);
      if(sameYear.length){
        const last = sameYear[sameYear.length-1];
        setYM(last.y,last.m);
        loadData();
        return;
      }
      if(availPairs.length){
        const last = availPairs[availPairs.length-1];
        setYM(last.y,last.m);
        loadData();
        return;
      }
      let mm = m + delta;
      if(mm<1) mm=12;
      if(mm>12) mm=1;
      $("m1").value=mm;
      if(!$("adv").checked) $("m2").value=mm;
      loadData();
      return;
    }

    let nidx = idx + delta;
    if(nidx<0) nidx = availPairs.length-1;
    if(nidx>=availPairs.length) nidx = 0;

    const next = availPairs[nidx];
    setYM(next.y, next.m);
    loadData();
  }

    $("m1").addEventListener("change", ()=>{
      if(!$("adv").checked){
        if($("y2")) $("y2").value = $("year").value;
        fillMonthSelect("m2", $("year").value, $("m1").value);
        $("m2").value = $("m1").value;
      }
      loadData();
    });

    $("m2").addEventListener("change", loadData);

    $("pm").onclick=()=>shiftMonth(-1);
    $("nm").onclick=()=>shiftMonth(+1);

    $("reload").onclick=async ()=>{
      await loadIndex();
      initSelects();
      loadData();
    };

    $("reset").onclick=resetUI;

    $("vendorSel").addEventListener("change", applyFilters);
    $("clearVendor").onclick=()=>{
      $("vendorSel").value="(全部)";
      applyFilters();
    };

    $("search").onclick=applyFilters;
    $("q").addEventListener("keydown",(e)=>{
      if(e.key==="Enter") applyFilters();
    });

    $("export").onclick=exportExcel;
    $("yearView").onclick=exportYearOverview;
    $("buyView").onclick=openBuyModal;

    $("admin").onclick = (e)=>{
      e.preventDefault(); e.stopPropagation();
      toggleAdmin();
    };

    $("announceBar").onclick = (e)=>{
      e.preventDefault(); e.stopPropagation();
      openAnnModal();
    };

    $("close").onclick=()=>closeModal("modal");
    $("buyClose").onclick=()=>closeModal("buyModal");
    $("vClose").onclick=()=>closeModal("vModal");

    $("modal").addEventListener("click",(e)=>{ if(e.target.id==="modal") closeModal("modal"); });
    $("buyModal").addEventListener("click",(e)=>{ if(e.target.id==="buyModal") closeModal("buyModal"); });
    $("vModal").addEventListener("click",(e)=>{ if(e.target.id==="vModal") closeModal("vModal"); });

    $("vendorPage").onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); openVendorModal(); };
    $("vSearch").addEventListener("input", renderVendorList);
    $("vClear").onclick=()=>{ $("vSearch").value=""; renderVendorList(); };

    $("vdSearch").addEventListener("input", renderVendorDrugs);
    $("vdClear").onclick=()=>{ $("vdSearch").value=""; renderVendorDrugs(); };
  }

  // ✅ 啟動：先讀 index → 再初始化 → 再載入資料
  (async ()=>{
    await loadIndex();
    initSelects();
    bindEvents();
    loadData();
  })();
})();
</script>
</body>
</html>
